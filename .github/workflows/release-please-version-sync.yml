name: Release Please version sync

on:
    pull_request_target:
        branches:
            - main
        types:
            - opened
            - reopened
            - synchronize
            - ready_for_review

permissions:
    contents: read
    pull-requests: read

concurrency:
    group: release-please-version-sync-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    sync:
        name: Sync Obsidian release metadata
        runs-on: ubuntu-latest
        if: >-
            github.event.pull_request.head.repo.full_name == github.repository &&
            !github.event.pull_request.draft &&
            github.event.pull_request.head.ref == 'release-please--branches--main'

        steps:
            - name: Checkout Release Please PR
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Sync metadata with trusted script
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  TRUSTED_SCRIPT: ${{ runner.temp }}/version-bump.mjs
              run: |
                  git show "${BASE_SHA}:version-bump.mjs" > "$TRUSTED_SCRIPT"
                  node "$TRUSTED_SCRIPT" sync
                  node "$TRUSTED_SCRIPT" check

            - name: Guard changed files
              run: |
                  changed_files="$(git diff --name-only)"

                  if [ -z "$changed_files" ]; then
                    echo "No metadata changes needed."
                    exit 0
                  fi

                  unexpected_files="$(printf '%s\n' "$changed_files" | grep -Ev '^(manifest\.json|versions\.json)$' || true)"

                  if [ -n "$unexpected_files" ]; then
                    echo "Unexpected files changed:"
                    printf '%s\n' "$unexpected_files"
                    exit 1
                  fi

            - name: Create GitHub App token
              id: app-token
              uses: actions/create-github-app-token@v3
              with:
                  app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
                  permission-contents: write

            - name: Push metadata changes
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  HEAD_REF: ${{ github.event.pull_request.head.ref }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  if git diff --quiet; then
                    echo "No metadata changes to commit."
                    exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add manifest.json versions.json
                  git commit -m "chore(release): sync Obsidian metadata"
                  git push --force-with-lease="refs/heads/${HEAD_REF}:${EXPECTED_HEAD_SHA}" "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:refs/heads/${HEAD_REF}"
