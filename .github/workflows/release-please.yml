name: Release Please

on:
    push:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: release-please-${{ github.workflow }}
    cancel-in-progress: false

jobs:
    release-please:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: write
            issues: write
            pull-requests: write
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              id: app-token
              with:
                  app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-issues: write
                  permission-pull-requests: write

            - id: release
              uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              with:
                  token: ${{ steps.app-token.outputs.token }}

    upload-release-assets:
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  ref: ${{ needs.release-please.outputs.tag_name }}
                  persist-credentials: false

            - name: Use Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Create GitHub App token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
                  permission-contents: write

            - name: Install dependencies
              run: npm ci

            - name: Check plugin
              run: npm run check

            - name: Upload release assets
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  REPOSITORY: ${{ github.repository }}
                  TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
              run: |
                  gh release upload "$TAG_NAME" main.js manifest.json --clobber --repo "$REPOSITORY"
                  if [ -f styles.css ]; then
                    gh release upload "$TAG_NAME" styles.css --clobber --repo "$REPOSITORY"
                  fi
                  gh release edit "$TAG_NAME" --draft=false --repo "$REPOSITORY"
