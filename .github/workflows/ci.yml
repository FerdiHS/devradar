name: CI

on:
    workflow_dispatch:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Quality checks - Node.js ${{ matrix.node-version }}
        runs-on: ubuntu-latest
        timeout-minutes: 10

        strategy:
            fail-fast: false
            matrix:
                node-version:
                    - 22.13.0
                    - 24.x

        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - name: Install npm baseline
              run: npm install --global --prefix "$RUNNER_TEMP/npm-baseline" --no-audit --no-fund npm@10.9.2

            - name: Activate npm baseline
              run: echo "$RUNNER_TEMP/npm-baseline/bin" >> "$GITHUB_PATH"

            - run: npm --version
            - run: npm ci
            - run: npm run version:check
            - run: npm run check
