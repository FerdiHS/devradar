version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      # Narrow compatibility deferrals: baseline #39, precedent #43/#44, triggering updates #48/#50, tracked by #51.
      # Coordinated ESLint 10 deferral: see #37 and #39; remove these @eslint/js and eslint major ignores when DevRadar intentionally completes the migration.
      ignore:
          - dependency-name: '@eslint/js'
            update-types:
                - version-update:semver-major
          - dependency-name: eslint
            update-types:
                - version-update:semver-major
          # Defer until the supported Node.js baseline supports lint-staged 17+; see #38 and #39.
          - dependency-name: lint-staged
            update-types:
                - version-update:semver-major
          # Re-evaluate this deferral whenever the minimum supported Node.js major changes.
          # Keep @types/node aligned with that minimum; when raising the baseline, update
          # @types/node to the matching major before deciding whether this major-update
          # deferral can be removed or must be retained. See #48 and #51.
          - dependency-name: '@types/node'
            update-types:
                - version-update:semver-major
          # This version-range ignore also suppresses TypeScript 7+ security updates; keep it visible and revisit with #45.
          # Remove or narrow only after the #45 security review and a coordinated TypeScript 7+ compiler, linting, build, and configuration migration; see #50 and #51.
          - dependency-name: typescript
            versions:
                - '>=7.0.0'
